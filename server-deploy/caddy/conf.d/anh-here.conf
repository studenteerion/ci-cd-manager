anh-here.example.com {
    reverse_proxy anh-here-container:8000 {
        header_up Host {host}
        header_up X-Real-IP {remote_host}
        header_up X-Forwarded-For {remote_host}
        header_up X-Forwarded-Proto {scheme}
    }

    log {
        output file /var/log/caddy/anh-here.log
        format json
    }
}
